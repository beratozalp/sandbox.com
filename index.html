
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Lab - Ultimate Sand Simulator</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;background:#10131b;color:#eef2ff;
 font-family:Arial,Helvetica,sans-serif;overflow:hidden;
}
header{
 height:58px;background:#191e2b;border-bottom:1px solid #30384b;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 14px;gap:10px
}
.logo{font-weight:900;font-size:19px;letter-spacing:.5px}
.logo span{color:#65b7ff}
#status{font-size:11px;color:#91a0ba}
main{height:calc(100dvh - 58px);display:flex;min-height:0}
aside{
 width:210px;flex-shrink:0;background:#191e2b;
 border-right:1px solid #30384b;display:flex;flex-direction:column;
 min-height:0
}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px}
.tabs button,.action{
 background:#252d3e;color:#cbd5e8;border:1px solid #364158;
 border-radius:7px;padding:9px 4px;font-size:11px;cursor:pointer
}
.tabs button.active{background:#1766a5;color:white;border-color:#42a5f5}
#materials{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:6px;padding:8px;overflow:auto;align-content:start
}
.material{
 min-height:65px;background:#222a3a;border:1px solid #354057;
 color:#e7edf9;border-radius:8px;display:flex;
 flex-direction:column;align-items:center;justify-content:center;
 gap:5px;font-size:11px;cursor:pointer
}
.material.selected{border:2px solid #63b9ff;background:#263d55}
.swatch{width:20px;height:20px;border-radius:4px;border:1px solid #ffffff40}
.tools{padding:10px;border-top:1px solid #30384b;display:grid;gap:8px}
.tools label{font-size:11px;color:#aab6cc}
.tools input{width:100%;accent-color:#4ca9f5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.action:active,.tabs button:active{transform:scale(.97)}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#canvasWrap{
 flex:1;min-height:0;display:flex;align-items:center;
 justify-content:center;background:#080b12;overflow:hidden;
}
canvas{
 width:100%;height:100%;object-fit:contain;
 image-rendering:pixelated;touch-action:none;cursor:crosshair
}
#bottom{
 height:34px;background:#191e2b;border-top:1px solid #30384b;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 12px;font-size:10px;color:#8e9bb2
}
#mobileToggle{
 display:none;position:absolute;z-index:4;bottom:45px;left:10px;
 background:#1766a5;color:white;border:0;border-radius:8px;padding:10px
}
@media(max-width:650px){
 header{height:50px}
 main{height:calc(100dvh - 50px)}
 aside{width:155px}
 #materials{grid-template-columns:repeat(2,1fr);gap:5px;padding:6px}
 .material{min-height:56px;font-size:10px}
 .tabs{gap:3px;padding:5px}
 .tabs button{font-size:9px;padding:8px 2px}
 .tools{padding:7px}
 .actions{grid-template-columns:1fr}
 .action{padding:8px 2px;font-size:10px}
 .logo{font-size:16px}
 #status{font-size:9px}
}
@media(max-width:390px){
 aside{width:135px}
}
</style>
</head>
<body>
<header>
 <div class="logo">PIXEL <span>LAB</span></div>
 <div id="status">ULTIMATE SANDBOX</div>
</header>

<main>
<aside>
 <div class="tabs" id="tabs">
  <button class="active" data-cat="all">Hepsi</button>
  <button data-cat="solid">Katı</button>
  <button data-cat="liquid">Sıvı</button>
  <button data-cat="nature">Doğa</button>
  <button data-cat="energy">Enerji</button>
  <button data-cat="gas">Gaz</button>
 </div>
 <div id="materials"></div>
 <div class="tools">
  <label>Fırça boyutu: <b id="brushValue">4</b></label>
  <input id="brush" type="range" min="1" max="18" value="4">
  <div class="actions">
   <button class="action" id="pause">⏸ Durdur</button>
   <button class="action" id="step">⏭ Tek adım</button>
   <button class="action" id="clear">🗑 Temizle</button>
   <button class="action" id="save">💾 Kaydet</button>
   <button class="action" id="load">📂 Yükle</button>
   <button class="action" id="eraser">⌫ Silgi</button>
  </div>
 </div>
</aside>

<section id="stage">
 <div id="canvasWrap"><canvas id="world"></canvas></div>
 <button id="mobileToggle">☰ Maddeler</button>
 <div id="bottom">
  <span id="selectedName">Seçili: Kum</span>
  <span id="fps">Pixel Lab • 144 × 96</span>
 </div>
</section>
</main>

<script>
(()=>{
"use strict";

const W=144,H=96;
const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d",{alpha:false});
canvas.width=W;canvas.height=H;

const materials=[
{id:1,n:"Kum",c:"#d8b56b",cat:"solid",type:"powder"},
{id:2,n:"Su",c:"#318ee8",cat:"liquid",type:"liquid"},
{id:3,n:"Taş",c:"#777e8c",cat:"solid",type:"solid"},
{id:4,n:"Ateş",c:"#ff7138",cat:"energy",type:"fire"},
{id:5,n:"Odun",c:"#80512d",cat:"nature",type:"solid"},
{id:6,n:"Bitki",c:"#43a64b",cat:"nature",type:"plant"},
{id:7,n:"Duman",c:"#8b91a0",cat:"gas",type:"gas"},
{id:8,n:"Duvar",c:"#4b5364",cat:"solid",type:"wall"},
{id:9,n:"Yağ",c:"#d7b83e",cat:"liquid",type:"liquid"},
{id:10,n:"Lav",c:"#f04b20",cat:"energy",type:"lava"},
{id:11,n:"Buz",c:"#9ce5ff",cat:"solid",type:"ice"},
{id:12,n:"Kar",c:"#e9f5ff",cat:"nature",type:"powder"},
{id:13,n:"Tuz",c:"#e9e9e9",cat:"solid",type:"powder"},
{id:14,n:"Asit",c:"#a1ed45",cat:"liquid",type:"acid"},
{id:15,n:"Metal",c:"#aab5c4",cat:"solid",type:"solid"},
{id:16,n:"Buhar",c:"#b7c8dc",cat:"gas",type:"gas"},
{id:17,n:"Kömür",c:"#292d36",cat:"solid",type:"solid"},
{id:18,n:"Bal",c:"#d99a25",cat:"liquid",type:"liquid"},
{id:19,n:"Toprak",c:"#80583b",cat:"solid",type:"powder"},
{id:20,n:"Tohum",c:"#a7a052",cat:"nature",type:"powder"},
{id:21,n:"Çiçek",c:"#ed6eb1",cat:"nature",type:"plant"},
{id:22,n:"Kül",c:"#777777",cat:"solid",type:"powder"},
{id:23,n:"Asit Gazı",c:"#b4d94b",cat:"gas",type:"gas"},
{id:24,n:"Cam",c:"#8ddbe4",cat:"solid",type:"solid"},
{id:25,n:"Sis",c:"#aebbc8",cat:"gas",type:"gas"},
{id:26,n:"Mum",c:"#f4d58a",cat:"solid",type:"solid"},
{id:27,n:"Elektrik",c:"#fff36a",cat:"energy",type:"electric"},
{id:28,n:"Soğuk",c:"#6ad9ff",cat:"energy",type:"cold"},
{id:29,n:"Beton",c:"#92959d",cat:"solid",type:"solid"},
{id:30,n:"Magma Kayası",c:"#5b3932",cat:"solid",type:"solid"}
];

const EMPTY=0;
let grid=new Uint8Array(W*H);
let heat=new Float32Array(W*H);
let life=new Uint16Array(W*H);
let selected=1,brush=4,paused=false;
let frame=0,changed=true;
let mouseDown=false,lastPoint=null;
let currentCategory="all";

const idx=(x,y)=>y*W+x;
const inside=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
const get=(x,y)=>inside(x,y)?grid[idx(x,y)]:3;
const set=(x,y,id)=>{
 if(inside(x,y)){
  let i=idx(x,y);grid[i]=id;heat[i]=0;life[i]=0;
 }
};
const swap=(a,b)=>{
 let t=grid[a];grid[a]=grid[b];grid[b]=t;
 let h=heat[a];heat[a]=heat[b];heat[b]=h;
 let l=life[a];life[a]=life[b];life[b]=l;
};
const rand=(n)=>Math.floor(Math.random()*n);
const chance=(n)=>Math.random()<n;

function renderMaterials(){
 const box=document.getElementById("materials");
 box.innerHTML="";
 materials.filter(m=>currentCategory==="all"||m.cat===currentCategory)
 .forEach(m=>{
  const el=document.createElement("button");
  el.className="material"+(selected===m.id?" selected":"");
  el.innerHTML=`<span class="swatch" style="background:${m.c}"></span>${m.n}`;
  el.onclick=()=>selectMaterial(m.id);
  box.appendChild(el);
 });
}
function selectMaterial(id){
 selected=id;
 const m=materials.find(x=>x.id===id);
 document.getElementById("selectedName").textContent="Seçili: "+m.n;
 renderMaterials();
}
document.querySelectorAll(".tabs button").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");currentCategory=b.dataset.cat;renderMaterials();
 };
});
renderMaterials();

document.getElementById("brush").oninput=e=>{
 brush=+e.target.value;
 document.getElementById("brushValue").textContent=brush;
};

function move(x,y,nx,ny){
 if(!inside(nx,ny)||get(nx,ny)!==0)return false;
 swap(idx(x,y),idx(nx,ny));return true;
}
function powder(x,y){
 if(move(x,y,x,y+1))return;
 let d=chance(.5)?-1:1;
 if(move(x,y,x+d,y+1))return;
 move(x,y,x-d,y+1);
}
function liquid(x,y){
 if(move(x,y,x,y+1))return;
 let d=chance(.5)?-1:1;
 if(move(x,y,x+d,y+1))return;
 if(move(x,y,x-d,y+1))return;
 if(chance(.6)){
  if(move(x,y,x+d,y))return;
  move(x,y,x-d,y);
 }
}
function gas(x,y){
 if(move(x,y,x,y-1))return;
 let d=chance(.5)?-1:1;
 if(move(x,y,x+d,y-1))return;
 if(move(x,y,x-d,y-1))return;
 if(chance(.5))move(x,y,x+d,y);
}
function burn(x,y,id){
 if(id===5||id===6||id===17||id===26||id===20){
  set(x,y,id===17?22:7);
  if(inside(x,y))life[idx(x,y)]=id===17?35:20;
 }
}

function react(x,y,id){
 const neighbors=[[0,-1],[1,0],[0,1],[-1,0]];
 for(const [dx,dy] of neighbors){
  let nx=x+dx,ny=y+dy,other=get(nx,ny);
  if(other===0)continue;

  if(id===4){
   if([5,6,17,20,21,26].includes(other)&&chance(.045))burn(nx,ny,other);
   if(other===2&&chance(.08)){set(nx,ny,16);set(x,y,7);return;}
   if(other===9&&chance(.06)){set(nx,ny,4);set(x,y,7);return;}
   if(other===11&&chance(.04)){set(nx,ny,2);}
  }

  if(id===10){
   if([5,6,17,20,21,26].includes(other)&&chance(.12))burn(nx,ny,other);
   if(other===2&&chance(.035)){set(nx,ny,16);set(x,y,3);return;}
  }

  if(id===14){
   if([3,5,6,15,17,19,24,29].includes(other)&&chance(.018)){
    set(nx,ny,23);
   }
  }

  if(id===6||id===21){
   if(other===2&&chance(.01))life[idx(x,y)]=Math.min(500,life[idx(x,y)]+1);
  }

  if(id===27){
   if(other===15&&chance(.2))heat[idx(nx,ny)]+=5;
   if(other===2&&chance(.08)){set(nx,ny,16);set(x,y,7);return;}
  }

  if(id===28&&other===2&&chance(.08)){
   set(nx,ny,11);
  }

  if(id===19&&other===20&&chance(.002)){
   set(x,y,6);
  }
 }
}

function updateCell(x,y){
 let i=idx(x,y),id=grid[i];
 if(id===0||id===3||id===8||id===15||id===24||id===29||id===30)return;

 if(id===1||id===12||id===13||id===19||id===20||id===22){
  powder(x,y);
 }else if(id===2||id===9||id===14||id===18){
  liquid(x,y);
 }else if(id===7||id===16||id===23||id===25){
  gas(x,y);
 }else if(id===4){
  if(chance(.5)){
   let nx=x+rand(3)-1,ny=y+rand(3)-1;
   if(inside(nx,ny)&&get(nx,ny)===0)set(nx,ny,4);
  }
  if(chance(.018))set(x,y,7);
 }else if(id===10){
  if(chance(.015))set(x,y,30);
  else if(chance(.2))heat[i]+=1;
 }else if(id===11){
  if(heat[i]>15&&chance(.1))set(x,y,2);
 }else if(id===27){
  react(x,y,id);
  if(chance(.15))set(x,y,0);
 }else if(id===28){
  react(x,y,id);
  if(chance(.08))set(x,y,0);
 }else if(id===6||id===21){
  if(life[i]>0)life[i]--;
  if(life[i]===0&&chance(.0005))set(x,y,22);
 }
 react(x,y,id);

 if(heat[i]>0)heat[i]=Math.max(0,heat[i]-.05);
 if(life[i]>0&&id===7&&chance(.04))life[i]--;
 if(id===7&&life[i]===1)set(x,y,0);
}

function update(){
 frame++;
 let leftToRight=chance(.5);
 for(let y=H-1;y>=0;y--){
  if(leftToRight){
   for(let x=0;x<W;x++)updateCell(x,y);
  }else{
   for(let x=W-1;x>=0;x--)updateCell(x,y);
  }
 }
 changed=true;
}

function draw(){
 const img=ctx.createImageData(W,H);
 const data=img.data;
 for(let i=0;i<grid.length;i++){
  let id=grid[i],p=i*4;
  if(id===0){
   data[p]=9;data[p+1]=12;data[p+2]=19;data[p+3]=255;continue;
  }
  const m=materials[id-1];
  let hex=m?m.c:"#ffffff";
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  let variation=rand(15)-7;
  data[p]=Math.max(0,Math.min(255,r+variation));
  data[p+1]=Math.max(0,Math.min(255,g+variation));
  data[p+2]=Math.max(0,Math.min(255,b+variation));
  data[p+3]=255;
 }
 ctx.putImageData(img,0,0);
 changed=false;
}

function paint(clientX,clientY){
 const rect=canvas.getBoundingClientRect();
 const x=Math.floor((clientX-rect.left)/rect.width*W);
 const y=Math.floor((clientY-rect.top)/rect.height*H);
 if(!inside(x,y))return;
 if(lastPoint){
  const dx=x-lastPoint.x,dy=y-lastPoint.y;
  const steps=Math.max(Math.abs(dx),Math.abs(dy),1);
  for(let s=0;s<=steps;s++){
   const px=Math.round(lastPoint.x+dx*s/steps);
   const py=Math.round(lastPoint.y+dy*s/steps);
   paintCircle(px,py);
  }
 }else paintCircle(x,y);
 lastPoint={x,y};
 changed=true;
}
function paintCircle(x,y){
 for(let dy=-brush;dy<=brush;dy++){
  for(let dx=-brush;dx<=brush;dx++){
   if(dx*dx+dy*dy>brush*brush)continue;
   if(!inside(x+dx,y+dy))continue;
   if(chance(.8))set(x+dx,y+dy,selected);
  }
 }
}
canvas.addEventListener("pointerdown",e=>{
 mouseDown=true;lastPoint=null;canvas.setPointerCapture(e.pointerId);
 paint(e.clientX,e.clientY);
});
canvas.addEventListener("pointermove",e=>{
 if(mouseDown)paint(e.clientX,e.clientY);
});
function stopPaint(){mouseDown=false;lastPoint=null;}
canvas.addEventListener("pointerup",stopPaint);
canvas.addEventListener("pointercancel",stopPaint);
canvas.addEventListener("contextmenu",e=>e.preventDefault());

document.getElementById("pause").onclick=e=>{
 paused=!paused;e.target.textContent=paused?"▶ Başlat":"⏸ Durdur";
};
document.getElementById("step").onclick=()=>{update();draw();};
document.getElementById("clear").onclick=()=>{
 if(confirm("Bütün dünyayı temizlemek istiyor musun?")){
  grid.fill(0);heat.fill(0);life.fill(0);draw();
 }
};
document.getElementById("eraser").onclick=()=>selectMaterial(0);
document.getElementById("save").onclick=()=>{
 try{
  localStorage.setItem("pixelLabSave",JSON.stringify({
   grid:Array.from(grid),heat:Array.from(heat),life:Array.from(life)
  }));
  alert("Dünya kaydedildi!");
 }catch(e){alert("Kaydetme başarısız.");}
};
document.getElementById("load").onclick=()=>{
 try{
  const data=JSON.parse(localStorage.getItem("pixelLabSave"));
  if(!data)throw new Error();
  grid.set(data.grid);heat.set(data.heat);life.set(data.life);
  draw();alert("Dünya yüklendi!");
 }catch(e){alert("Kayıt bulunamadı.");}
};

document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 if(e.code==="Space"){paused=!paused;document.getElementById("pause").textContent=paused?"▶ Başlat":"⏸ Durdur";}
 if(e.key==="1")selectMaterial(1);
 if(e.key==="2")selectMaterial(2);
 if(e.key==="3")selectMaterial(3);
 if(e.key==="4")selectMaterial(4);
 if(e.key==="5")selectMaterial(5);
 if(e.key==="6")selectMaterial(6);
 if(e.key==="7")selectMaterial(7);
 if(e.key==="8")selectMaterial(8);
});

let last=performance.now(),fpsCount=0,fpsTime=last;
function loop(now){
 if(!paused){
  update();
  update();
 }
 if(changed)draw();
 fpsCount++;
 if(now-fpsTime>=1000){
  document.getElementById("fps").textContent=
   "FPS: "+fpsCount+" • "+W+" × "+H;
  fpsCount=0;fpsTime=now;
 }
 requestAnimationFrame(loop);
}
draw();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
